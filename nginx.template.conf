user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    # upstream definition: template will be rendered by generate-nginx.sh
    upstream backend {
        # primary is put first; backup keyword added based on ACTIVE_POOL
        server app_blue:3000 max_fails=1 fail_timeout=3s ${BACKUP_BLUE};
        server app_green:3000 max_fails=1 fail_timeout=3s ${BACKUP_GREEN};
    }

    server {
        listen 80;
        server_name _;

        # Short client timeouts to keep requests <= 10s (grader constraint)
        client_body_timeout 8s;
        client_header_timeout 8s;
        keepalive_timeout 8s;
        send_timeout 8s;

        location / {
            proxy_pass http://backend;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Forward necessary headers and keep app headers intact
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve upstream response headers for clients
            proxy_pass_header X-App-Pool;
            proxy_pass_header X-Release-Id;
        }
    }
}
